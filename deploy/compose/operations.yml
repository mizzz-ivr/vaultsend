name: vaultsend-operations

services:
  audit-worker:
    image: ${VAULTSEND_IMAGE:?VAULTSEND_IMAGE is required}
    command:
      - /usr/local/bin/vaultsend-audit-worker
    restart: unless-stopped
    init: true
    read_only: true
    user: "65532:65532"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    pids_limit: 128
    stop_grace_period: 30s
    environment:
      DATABASE_URL_FILE: /run/secrets/audit_worker_database_url
      AUDIT_OUTBOX_POLL_INTERVAL_SEC: ${AUDIT_OUTBOX_POLL_INTERVAL_SEC:-2}
      AUDIT_OUTBOX_BATCH_SIZE: ${AUDIT_OUTBOX_BATCH_SIZE:-100}
      AUDIT_OUTBOX_RETENTION_HOURS: ${AUDIT_OUTBOX_RETENTION_HOURS:-168}
      AUDIT_OUTBOX_CLEANUP_BATCH_SIZE: ${AUDIT_OUTBOX_CLEANUP_BATCH_SIZE:-500}
    secrets:
      - audit_worker_database_url
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.13.1}
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    pids_limit: 256
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --storage.tsdb.wal-compression
      - --web.listen-address=0.0.0.0:9090
    ports:
      - 127.0.0.1:${PROMETHEUS_PORT:-9090}:9090
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/prometheus/alerts:/etc/prometheus/alerts:ro
      - ../monitoring/prometheus/targets:/etc/prometheus/targets:ro
      - prometheus-data:/prometheus
    secrets:
      - internal_metrics_token
    networks:
      - monitoring
    depends_on:
      - alertmanager
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  alertmanager:
    image: ${ALERTMANAGER_IMAGE:-prom/alertmanager:v0.32.1}
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    pids_limit: 128
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.listen-address=0.0.0.0:9093
    ports:
      - 127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093
    volumes:
      - ../monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    secrets:
      - alertmanager_webhook_url
    networks:
      - monitoring
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:13.1.0}
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    pids_limit: 256
    ports:
      - 127.0.0.1:${GRAFANA_PORT:-3001}:3000
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-vaultsend-admin}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_COOKIE_SECURE: ${GRAFANA_COOKIE_SECURE:-false}
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_LOG_MODE: console
    volumes:
      - grafana-data:/var/lib/grafana
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    secrets:
      - grafana_admin_password
    networks:
      - monitoring
    depends_on:
      - prometheus
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

secrets:
  audit_worker_database_url:
    file: ${AUDIT_WORKER_DATABASE_URL_FILE:?AUDIT_WORKER_DATABASE_URL_FILE is required}
  internal_metrics_token:
    file: ${INTERNAL_METRICS_TOKEN_FILE:?INTERNAL_METRICS_TOKEN_FILE is required}
  alertmanager_webhook_url:
    file: ${ALERTMANAGER_WEBHOOK_URL_FILE:?ALERTMANAGER_WEBHOOK_URL_FILE is required}
  grafana_admin_password:
    file: ${GRAFANA_ADMIN_PASSWORD_FILE:?GRAFANA_ADMIN_PASSWORD_FILE is required}

networks:
  monitoring:
    name: ${VAULTSEND_MONITORING_NETWORK:-vaultsend-monitoring}
    external: true

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:
