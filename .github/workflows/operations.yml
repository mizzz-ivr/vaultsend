name: Operations

on:
  pull_request:
    branches:
      - main
    paths:
      - Dockerfile
      - .dockerignore
      - go.mod
      - go.sum
      - cmd/**
      - internal/config/**
      - deploy/**
      - scripts/verify-operations-config.sh
      - scripts/resolve-current-release-image.sh
      - scripts/verify-release-image.sh
      - scripts/deploy-verified-compose.sh
      - scripts/deploy-approved-production.sh
      - scripts/validate-production-deployment-request.sh
      - scripts/test-verified-compose-deployment.sh
      - scripts/test-production-deployment-policy.sh
      - scripts/test-approved-production-deployment.sh
      - .github/workflows/operations.yml
      - .github/workflows/release-image-acceptance.yml
      - .github/workflows/production-deploy.yml
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - .dockerignore
      - go.mod
      - go.sum
      - cmd/**
      - internal/config/**
      - deploy/**
      - scripts/verify-operations-config.sh
      - scripts/resolve-current-release-image.sh
      - scripts/verify-release-image.sh
      - scripts/deploy-verified-compose.sh
      - scripts/deploy-approved-production.sh
      - scripts/validate-production-deployment-request.sh
      - scripts/test-verified-compose-deployment.sh
      - scripts/test-production-deployment-policy.sh
      - scripts/test-approved-production-deployment.sh
      - .github/workflows/operations.yml
      - .github/workflows/release-image-acceptance.yml
      - .github/workflows/production-deploy.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: operations-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Container・Compose・Monitoring・Deploy Gate
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: 診断ログディレクトリを作成
        run: mkdir -p .ci-logs/operations

      - name: DockerとComposeのバージョンを記録
        shell: bash
        run: |
          {
            docker version
            docker compose version
            go version
            jq --version
          } 2>&1 | tee .ci-logs/operations/tool-versions.log

      - name: GitHub Actions Workflowをactionlintで検証
        shell: bash
        env:
          GOTOOLCHAIN: auto
        run: |
          set -o pipefail
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 \
            .github/workflows/operations.yml \
            .github/workflows/release-image-acceptance.yml \
            .github/workflows/production-deploy.yml \
            2>&1 | tee .ci-logs/operations/actionlint.log

      - name: デプロイ前ゲートの構文とmock動作を検証
        shell: bash
        run: |
          set -o pipefail
          bash -n \
            scripts/verify-operations-config.sh \
            scripts/resolve-current-release-image.sh \
            scripts/verify-release-image.sh \
            scripts/deploy-verified-compose.sh \
            scripts/deploy-approved-production.sh \
            scripts/validate-production-deployment-request.sh \
            scripts/test-verified-compose-deployment.sh \
            scripts/test-production-deployment-policy.sh \
            scripts/test-approved-production-deployment.sh
          bash scripts/test-verified-compose-deployment.sh \
            2>&1 | tee .ci-logs/operations/deploy-gate-test.log
          bash scripts/test-production-deployment-policy.sh \
            2>&1 | tee .ci-logs/operations/production-deployment-policy-test.log
          bash scripts/test-approved-production-deployment.sh \
            2>&1 | tee .ci-logs/operations/approved-production-deployment-test.log

      - name: コンテナと監視設定を検証
        shell: bash
        run: |
          set -o pipefail
          bash scripts/verify-operations-config.sh 2>&1 | tee .ci-logs/operations/verify.log

      - name: 運用設定の失敗ログを保存
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: operations-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-logs/operations
          if-no-files-found: ignore
          retention-days: 7
