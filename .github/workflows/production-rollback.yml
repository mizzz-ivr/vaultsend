name: Production Rollback Authorization

on:
  workflow_dispatch:
    inputs:
      change_request_id:
        description: 変更管理番号（Issue、申請、障害対応など）
        required: true
        type: string
      rollback_reason:
        description: ロールバック理由（10〜300文字、機密情報禁止）
        required: true
        type: string
      expected_current_image:
        description: 現在稼働中として期待するdigest固定イメージ
        required: true
        type: string
      expected_current_revision:
        description: 現在稼働中として期待するsource revision
        required: true
        type: string
      target_image:
        description: 戻し先のdigest固定イメージ
        required: true
        type: string
      target_revision:
        description: 戻し先のsource revision
        required: true
        type: string
      confirmation:
        description: 誤操作防止のためROLLBACK_PRODUCTIONを入力
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-rollback-authorization
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  EXPECTED_IMAGE_REPOSITORY: ghcr.io/mizzz-ivr/vaultsend

jobs:
  prepare:
    name: 本番ロールバック要求・対象イメージ事前検証
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
      attestations: read
    outputs:
      reason_sha256: ${{ steps.request.outputs.reason_sha256 }}

    steps:
      - name: mainの検証コードを取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: 本番ロールバック要求を検証
        id: request
        shell: bash
        env:
          CHANGE_REQUEST_ID: ${{ inputs.change_request_id }}
          ROLLBACK_REASON: ${{ inputs.rollback_reason }}
          ROLLBACK_CONFIRMATION: ${{ inputs.confirmation }}
          EXPECTED_CURRENT_IMAGE: ${{ inputs.expected_current_image }}
          EXPECTED_CURRENT_REVISION: ${{ inputs.expected_current_revision }}
          TARGET_IMAGE: ${{ inputs.target_image }}
          TARGET_REVISION: ${{ inputs.target_revision }}
          REQUESTED_BY: ${{ github.actor }}
          REQUESTED_REF: ${{ github.ref }}
          REQUESTED_SHA: ${{ github.sha }}
          REQUEST_RUN_ID: ${{ github.run_id }}
          REQUEST_RUN_ATTEMPT: ${{ github.run_attempt }}
          PRODUCTION_ROLLBACK_REQUEST_DIR: artifacts/production-rollback/preflight/request
        run: |
          bash scripts/validate-production-rollback-request.sh
          reason_sha256="$(jq -r '.rollback_reason_sha256' artifacts/production-rollback/preflight/request/request.json)"
          echo "reason_sha256=${reason_sha256}" >> "${GITHUB_OUTPUT}"

      - name: GHCRへread-onlyログイン
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export DOCKER_CONFIG="${RUNNER_TEMP}/docker-rollback-preflight"
          mkdir -p "${DOCKER_CONFIG}"
          printf '%s' "${GHCR_TOKEN}" | docker login "${REGISTRY}" \
            --username "${GITHUB_ACTOR}" \
            --password-stdin
          echo "DOCKER_CONFIG=${DOCKER_CONFIG}" >> "${GITHUB_ENV}"

      - name: Cosignをセットアップ
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: 戻し元イメージを検証
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VAULTSEND_IMAGE: ${{ inputs.expected_current_image }}
          EXPECTED_SOURCE_REVISION: ${{ inputs.expected_current_revision }}
          DEPLOY_VERIFICATION_DIR: artifacts/production-rollback/preflight/current-verification
        run: bash scripts/verify-release-image.sh

      - name: 戻し先イメージを検証
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VAULTSEND_IMAGE: ${{ inputs.target_image }}
          EXPECTED_SOURCE_REVISION: ${{ inputs.target_revision }}
          DEPLOY_VERIFICATION_DIR: artifacts/production-rollback/preflight/target-verification
        run: bash scripts/verify-release-image.sh

      - name: 戻し先revisionがmain履歴上の祖先であることを確認
        shell: bash
        env:
          CURRENT_REVISION: ${{ inputs.expected_current_revision }}
          TARGET_REVISION_VALUE: ${{ inputs.target_revision }}
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          first_parent_history="$(git rev-list --first-parent origin/main)"
          grep -Fxq "${CURRENT_REVISION}" <<<"${first_parent_history}" || {
            echo "戻し元revisionがmainのfirst-parent履歴にありません: ${CURRENT_REVISION}" >&2
            exit 1
          }
          grep -Fxq "${TARGET_REVISION_VALUE}" <<<"${first_parent_history}" || {
            echo "戻し先revisionがmainのfirst-parent履歴にありません: ${TARGET_REVISION_VALUE}" >&2
            exit 1
          }
          git merge-base --is-ancestor "${TARGET_REVISION_VALUE}" "${CURRENT_REVISION}" || {
            echo '戻し先revisionは戻し元revisionの祖先ではありません' >&2
            exit 1
          }

      - name: 承認対象manifestを生成
        shell: bash
        run: |
          # jqの$request等はshell変数ではなく--slurpfileで定義したjq変数。
          # shellcheck disable=SC2016
          jq -n \
            --slurpfile request artifacts/production-rollback/preflight/request/request.json \
            --slurpfile current artifacts/production-rollback/preflight/current-verification/verification-summary.json \
            --slurpfile target artifacts/production-rollback/preflight/target-verification/verification-summary.json \
            '{
              request: $request[0],
              current_verification: $current[0],
              target_verification: $target[0],
              approval_environment: "production-rollback"
            }' > artifacts/production-rollback/preflight/approval-target.json
          jq -e '
            .request.expected_current.image == .current_verification.image and
            .request.expected_current.source_revision == .current_verification.revision and
            .request.target.image == .target_verification.image and
            .request.target.source_revision == .target_verification.revision and
            .current_verification.cosign_signature_verified == true and
            .current_verification.provenance_verified == true and
            .current_verification.spdx_sbom_verified == true and
            .target_verification.cosign_signature_verified == true and
            .target_verification.provenance_verified == true and
            .target_verification.spdx_sbom_verified == true
          ' artifacts/production-rollback/preflight/approval-target.json >/dev/null

      - name: 事前検証結果をJob Summaryへ記録
        shell: bash
        env:
          SUMMARY_CHANGE_REQUEST_ID: ${{ inputs.change_request_id }}
          SUMMARY_CURRENT_IMAGE: ${{ inputs.expected_current_image }}
          SUMMARY_CURRENT_REVISION: ${{ inputs.expected_current_revision }}
          SUMMARY_TARGET_IMAGE: ${{ inputs.target_image }}
          SUMMARY_TARGET_REVISION: ${{ inputs.target_revision }}
          SUMMARY_REASON_SHA256: ${{ steps.request.outputs.reason_sha256 }}
        run: |
          {
            echo '## 本番ロールバック許可申請'
            echo
            echo '| 項目 | 値 |'
            echo '|---|---|'
            printf '| 変更管理番号 | `%s` |\n' "${SUMMARY_CHANGE_REQUEST_ID}"
            printf '| 戻し元 | `%s` |\n' "${SUMMARY_CURRENT_IMAGE}"
            printf '| 戻し元revision | `%s` |\n' "${SUMMARY_CURRENT_REVISION}"
            printf '| 戻し先 | `%s` |\n' "${SUMMARY_TARGET_IMAGE}"
            printf '| 戻し先revision | `%s` |\n' "${SUMMARY_TARGET_REVISION}"
            printf '| 理由SHA-256 | `%s` |\n' "${SUMMARY_REASON_SHA256}"
            echo
            echo 'production-rollback Environmentの承認後、同じfrom/toを再検証して30分有効なAttestation付き許可証を発行します。'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: 承認前の検証証跡を保存
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-rollback-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/production-rollback/preflight
          if-no-files-found: warn
          retention-days: 90

      - name: GHCR認証情報を削除
        if: always()
        shell: bash
        run: rm -rf "${DOCKER_CONFIG:-${RUNNER_TEMP}/docker-rollback-preflight}"

  authorize:
    name: production-rollback承認後の許可証発行
    needs:
      - prepare
    environment:
      name: production-rollback
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: 承認済みmainの検証コードを取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: production-rollback Environmentと実行contextを検証
        shell: bash
        env:
          WORKFLOW_REF_VALUE: ${{ github.workflow_ref }}
          ROLLBACK_ENABLED_VALUE: ${{ vars.PRODUCTION_ROLLBACK_ENABLED }}
          ROLLBACK_GUARD_VALUE: ${{ secrets.PRODUCTION_ROLLBACK_GUARD }}
        run: |
          set -Eeuo pipefail
          [[ "${ROLLBACK_ENABLED_VALUE}" == "true" ]] || {
            echo 'production-rollback Environmentが有効化されていません' >&2
            exit 1
          }
          [[ ${#ROLLBACK_GUARD_VALUE} -ge 32 ]] || {
            echo 'production-rollback Environment guardが未設定または短すぎます' >&2
            exit 1
          }
          [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]] || {
            echo "許可されていないeventです: ${GITHUB_EVENT_NAME}" >&2
            exit 1
          }
          [[ "${GITHUB_REF}" == "refs/heads/main" ]] || {
            echo "本番ロールバック許可証はmainからのみ発行できます: ${GITHUB_REF}" >&2
            exit 1
          }
          [[ "${WORKFLOW_REF_VALUE}" == "${GITHUB_REPOSITORY}/.github/workflows/production-rollback.yml@refs/heads/main" ]] || {
            echo "Workflow refがmainのロールバック許可Workflowではありません: ${WORKFLOW_REF_VALUE}" >&2
            exit 1
          }

      - name: 本番ロールバック要求を再検証
        shell: bash
        env:
          CHANGE_REQUEST_ID: ${{ inputs.change_request_id }}
          ROLLBACK_REASON: ${{ inputs.rollback_reason }}
          ROLLBACK_CONFIRMATION: ${{ inputs.confirmation }}
          EXPECTED_CURRENT_IMAGE: ${{ inputs.expected_current_image }}
          EXPECTED_CURRENT_REVISION: ${{ inputs.expected_current_revision }}
          TARGET_IMAGE: ${{ inputs.target_image }}
          TARGET_REVISION: ${{ inputs.target_revision }}
          REQUESTED_BY: ${{ github.actor }}
          REQUESTED_REF: ${{ github.ref }}
          REQUESTED_SHA: ${{ github.sha }}
          REQUEST_RUN_ID: ${{ github.run_id }}
          REQUEST_RUN_ATTEMPT: ${{ github.run_attempt }}
          PRODUCTION_ROLLBACK_REQUEST_DIR: artifacts/production-rollback/authorization/request
        run: bash scripts/validate-production-rollback-request.sh

      - name: GHCRへread-onlyログイン
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export DOCKER_CONFIG="${RUNNER_TEMP}/docker-rollback-authorization"
          mkdir -p "${DOCKER_CONFIG}"
          printf '%s' "${GHCR_TOKEN}" | docker login "${REGISTRY}" \
            --username "${GITHUB_ACTOR}" \
            --password-stdin
          echo "DOCKER_CONFIG=${DOCKER_CONFIG}" >> "${GITHUB_ENV}"

      - name: Cosignをセットアップ
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: 承認済み戻し元イメージを再検証
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VAULTSEND_IMAGE: ${{ inputs.expected_current_image }}
          EXPECTED_SOURCE_REVISION: ${{ inputs.expected_current_revision }}
          DEPLOY_VERIFICATION_DIR: artifacts/production-rollback/authorization/current-verification
        run: bash scripts/verify-release-image.sh

      - name: 承認済み戻し先イメージを再検証
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VAULTSEND_IMAGE: ${{ inputs.target_image }}
          EXPECTED_SOURCE_REVISION: ${{ inputs.target_revision }}
          DEPLOY_VERIFICATION_DIR: artifacts/production-rollback/authorization/target-verification
        run: bash scripts/verify-release-image.sh

      - name: 承認済みrevision関係を再検証
        shell: bash
        env:
          CURRENT_REVISION: ${{ inputs.expected_current_revision }}
          TARGET_REVISION_VALUE: ${{ inputs.target_revision }}
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          first_parent_history="$(git rev-list --first-parent origin/main)"
          grep -Fxq "${CURRENT_REVISION}" <<<"${first_parent_history}"
          grep -Fxq "${TARGET_REVISION_VALUE}" <<<"${first_parent_history}"
          git merge-base --is-ancestor "${TARGET_REVISION_VALUE}" "${CURRENT_REVISION}"

      - name: 期限付きロールバック許可manifestを生成
        id: manifest
        shell: bash
        env:
          CURRENT_IMAGE: ${{ inputs.expected_current_image }}
          CURRENT_REVISION: ${{ inputs.expected_current_revision }}
          TARGET_IMAGE_VALUE: ${{ inputs.target_image }}
          TARGET_REVISION_VALUE: ${{ inputs.target_revision }}
          REASON_SHA256: ${{ needs.prepare.outputs.reason_sha256 }}
          CHANGE_REQUEST_ID_VALUE: ${{ inputs.change_request_id }}
        run: |
          set -Eeuo pipefail
          authorization_dir='artifacts/production-rollback/authorization'
          manifest_path="${authorization_dir}/rollback-authorization-manifest.json"
          authorized_at_epoch="$(date -u +%s)"
          expires_at_epoch="$((authorized_at_epoch + 1800))"
          authorized_at="$(date -u -d "@${authorized_at_epoch}" +'%Y-%m-%dT%H:%M:%SZ')"
          expires_at="$(date -u -d "@${expires_at_epoch}" +'%Y-%m-%dT%H:%M:%SZ')"

          # jqの$current_image等は--argで定義したjq変数。
          # shellcheck disable=SC2016
          jq -n \
            --arg current_image "${CURRENT_IMAGE}" \
            --arg current_revision "${CURRENT_REVISION}" \
            --arg target_image "${TARGET_IMAGE_VALUE}" \
            --arg target_revision "${TARGET_REVISION_VALUE}" \
            --arg change_request_id "${CHANGE_REQUEST_ID_VALUE}" \
            --arg rollback_reason_sha256 "${REASON_SHA256}" \
            --arg requested_by "${GITHUB_ACTOR}" \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg workflow_ref "${GITHUB_WORKFLOW_REF}" \
            --arg workflow_sha "${GITHUB_SHA}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --arg run_attempt "${GITHUB_RUN_ATTEMPT}" \
            --arg authorized_at "${authorized_at}" \
            --arg expires_at "${expires_at}" \
            --argjson authorized_at_epoch "${authorized_at_epoch}" \
            --argjson expires_at_epoch "${expires_at_epoch}" \
            '{
              schema_version: "1",
              authorization_type: "rollback",
              authorization_status: "approved",
              environment: "production-rollback",
              expected_current: {
                image: $current_image,
                source_revision: $current_revision
              },
              target: {
                image: $target_image,
                source_revision: $target_revision
              },
              change_request_id: $change_request_id,
              rollback_reason_sha256: $rollback_reason_sha256,
              requested_by: $requested_by,
              workflow: {
                repository: $repository,
                ref: $workflow_ref,
                sha: $workflow_sha,
                run_id: $run_id,
                run_attempt: $run_attempt
              },
              authorized_at: $authorized_at,
              authorized_at_epoch: $authorized_at_epoch,
              expires_at: $expires_at,
              expires_at_epoch: $expires_at_epoch
            }' > "${manifest_path}"

          jq -e '
            .authorization_type == "rollback" and
            .authorization_status == "approved" and
            .environment == "production-rollback" and
            .expected_current.image != .target.image and
            .workflow.ref == "mizzz-ivr/vaultsend/.github/workflows/production-rollback.yml@refs/heads/main" and
            (.expires_at_epoch - .authorized_at_epoch) == 1800
          ' "${manifest_path}" >/dev/null

          sha256sum "${manifest_path}" > "${manifest_path}.sha256"
          echo "manifest_path=${manifest_path}" >> "${GITHUB_OUTPUT}"

      - name: ロールバック許可manifestへArtifact Attestationを付与
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: ${{ steps.manifest.outputs.manifest_path }}
          show-summary: true

      - name: ロールバック許可manifestのAttestationを即時検証
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MANIFEST_PATH: ${{ steps.manifest.outputs.manifest_path }}
        run: |
          set -Eeuo pipefail
          verification_file='artifacts/production-rollback/authorization/authorization-attestation-verification.json'
          for attempt in $(seq 1 6); do
            if gh attestation verify "${MANIFEST_PATH}" \
              --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/production-rollback.yml" \
              --source-ref 'refs/heads/main' \
              --source-digest "${GITHUB_SHA}" \
              --cert-oidc-issuer 'https://token.actions.githubusercontent.com' \
              --deny-self-hosted-runners \
              --format json > "${verification_file}"; then
              break
            fi
            if [[ "${attempt}" -eq 6 ]]; then
              echo 'ロールバック許可manifestのAttestationを検証できませんでした' >&2
              exit 1
            fi
            sleep 5
          done
          jq -e 'type == "array" and length > 0' "${verification_file}" >/dev/null

      - name: ロールバック許可証をJob Summaryへ記録
        shell: bash
        env:
          MANIFEST_PATH: ${{ steps.manifest.outputs.manifest_path }}
        run: |
          {
            echo '## 本番ロールバック許可証を発行しました'
            echo
            echo '| 項目 | 値 |'
            echo '|---|---|'
            jq -r '
              "| 変更管理番号 | `\(.change_request_id)` |\n" +
              "| 戻し元 | `\(.expected_current.image)` |\n" +
              "| 戻し先 | `\(.target.image)` |\n" +
              "| 戻し先revision | `\(.target.source_revision)` |\n" +
              "| 有効期限 | `\(.expires_at)` |\n" +
              "| Workflow run | `\(.workflow.run_id)` |"
            ' "${MANIFEST_PATH}"
            echo
            echo '本番hostでは現在release・過去の正常デプロイ履歴・許可証・イメージ署名を再検証し、一度だけ使用してください。'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Attestation付き本番ロールバック許可証を保存
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-rollback-authorization-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/production-rollback/authorization
          if-no-files-found: warn
          retention-days: 90

      - name: GHCR認証情報を削除
        if: always()
        shell: bash
        run: rm -rf "${DOCKER_CONFIG:-${RUNNER_TEMP}/docker-rollback-authorization}"
