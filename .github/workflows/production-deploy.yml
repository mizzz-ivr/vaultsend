name: Production Deployment

on:
  workflow_dispatch:
    inputs:
      change_request_id:
        description: 変更管理番号（Issue、申請、作業依頼など）
        required: true
        type: string
      deployment_reason:
        description: 本番デプロイ理由（10〜300文字、1行）
        required: true
        type: string
      confirmation:
        description: 誤操作防止のためDEPLOY_PRODUCTIONを入力
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  EXPECTED_IMAGE_REPOSITORY: ghcr.io/mizzz-ivr/vaultsend

jobs:
  prepare:
    name: 本番デプロイ要求・公開イメージ事前検証
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
      attestations: read
    outputs:
      image_ref: ${{ steps.release.outputs.image_ref }}
      source_revision: ${{ steps.release.outputs.source_revision }}
      change_request_id: ${{ inputs.change_request_id }}
      reason_sha256: ${{ steps.request.outputs.reason_sha256 }}

    steps:
      - name: mainの検証コードを取得
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: 本番デプロイ要求を検証
        id: request
        shell: bash
        env:
          CHANGE_REQUEST_ID: ${{ inputs.change_request_id }}
          DEPLOYMENT_REASON: ${{ inputs.deployment_reason }}
          DEPLOYMENT_CONFIRMATION: ${{ inputs.confirmation }}
          REQUESTED_BY: ${{ github.actor }}
          REQUESTED_REF: ${{ github.ref }}
          REQUESTED_SHA: ${{ github.sha }}
          REQUEST_RUN_ID: ${{ github.run_id }}
          REQUEST_RUN_ATTEMPT: ${{ github.run_attempt }}
          PRODUCTION_DEPLOYMENT_REQUEST_DIR: artifacts/production-deployment/request
        run: |
          bash scripts/validate-production-deployment-request.sh
          reason_sha256="$(jq -r '.deployment_reason_sha256' artifacts/production-deployment/request/request.json)"
          echo "reason_sha256=${reason_sha256}" >> "${GITHUB_OUTPUT}"

      - name: GHCRへread-onlyログイン
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "${GHCR_TOKEN}" | docker login "${REGISTRY}" \
            --username "${GITHUB_ACTOR}" \
            --password-stdin

      - name: 現在の公開済みmainイメージを解決
        id: release
        shell: bash
        env:
          RELEASE_RESOLUTION_DIR: artifacts/production-deployment/release
        run: |
          bash scripts/resolve-current-release-image.sh
          image_ref="$(jq -r '.image' artifacts/production-deployment/release/release-resolution.json)"
          source_revision="$(jq -r '.revision' artifacts/production-deployment/release/release-resolution.json)"
          echo "image_ref=${image_ref}" >> "${GITHUB_OUTPUT}"
          echo "source_revision=${source_revision}" >> "${GITHUB_OUTPUT}"

      - name: Cosignをセットアップ
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: 署名・provenance・SPDX SBOMを事前検証
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VAULTSEND_IMAGE: ${{ steps.release.outputs.image_ref }}
          EXPECTED_SOURCE_REVISION: ${{ steps.release.outputs.source_revision }}
          DEPLOY_VERIFICATION_DIR: artifacts/production-deployment/preflight-verification
        run: bash scripts/verify-release-image.sh

      - name: 承認対象manifestを生成
        shell: bash
        run: |
          jq -n \
            --slurpfile request artifacts/production-deployment/request/request.json \
            --slurpfile release artifacts/production-deployment/release/release-resolution.json \
            --slurpfile verification artifacts/production-deployment/preflight-verification/verification-summary.json \
            '{
              request: $request[0],
              release: $release[0],
              preflight_verification: $verification[0],
              approval_environment: "production"
            }' > artifacts/production-deployment/approval-manifest.json
          jq -e \
            '.release.revision == .preflight_verification.revision and
             .preflight_verification.cosign_signature_verified == true and
             .preflight_verification.provenance_verified == true and
             .preflight_verification.spdx_sbom_verified == true' \
            artifacts/production-deployment/approval-manifest.json >/dev/null

      - name: 事前検証結果をJob Summaryへ記録
        shell: bash
        run: |
          {
            echo '## 本番デプロイ承認待ち'
            echo
            echo '| 項目 | 値 |'
            echo '|---|---|'
            echo "| 変更管理番号 | \`${{ inputs.change_request_id }}\` |"
            echo "| 起動者 | \`${GITHUB_ACTOR}\` |"
            echo "| Image | \`${{ steps.release.outputs.image_ref }}\` |"
            echo "| Revision | \`${{ steps.release.outputs.source_revision }}\` |"
            echo "| 理由SHA-256 | \`${{ steps.request.outputs.reason_sha256 }}\` |"
            echo
            echo '`production` Environmentの承認後、専用self-hosted runnerで同じdigestを再検証してデプロイします。'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: 承認前の検証証跡を保存
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: production-deployment-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/production-deployment
          if-no-files-found: warn
          retention-days: 90

  deploy:
    name: production承認後のComposeデプロイ
    needs:
      - prepare
    environment:
      name: production
    runs-on: [self-hosted, linux, x64, vaultsend-production]
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
      attestations: read

    steps:
      - name: 承認済みmainの検証コードを取得
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Cosignをセットアップ
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: production runnerと実行contextを検証
        shell: bash
        env:
          RUNNER_ENVIRONMENT_VALUE: ${{ runner.environment }}
          WORKFLOW_REF_VALUE: ${{ github.workflow_ref }}
        run: |
          set -Eeuo pipefail
          [[ "${RUNNER_ENVIRONMENT_VALUE}" == "self-hosted" ]] || {
            echo '本番デプロイはself-hosted runnerでのみ実行できます' >&2
            exit 1
          }
          [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]] || {
            echo "許可されていないeventです: ${GITHUB_EVENT_NAME}" >&2
            exit 1
          }
          [[ "${GITHUB_REF}" == "refs/heads/main" ]] || {
            echo "本番デプロイはmainからのみ実行できます: ${GITHUB_REF}" >&2
            exit 1
          }
          [[ "${WORKFLOW_REF_VALUE}" == "${GITHUB_REPOSITORY}/.github/workflows/production-deploy.yml@refs/heads/main" ]] || {
            echo "Workflow refがmainの本番デプロイWorkflowではありません: ${WORKFLOW_REF_VALUE}" >&2
            exit 1
          }
          [[ "$(id -u)" -ne 0 ]] || {
            echo 'self-hosted runnerをrootで実行しないでください' >&2
            exit 1
          }
          for command_name in docker gh jq stat; do
            command -v "${command_name}" >/dev/null 2>&1 || {
              echo "必要なコマンドが見つかりません: ${command_name}" >&2
              exit 1
            }
          done
          docker info >/dev/null
          [[ -f deploy/compose/.env && ! -L deploy/compose/.env ]] || {
            echo 'deploy/compose/.envが存在しないかsymbolic linkです' >&2
            exit 1
          }
          env_mode="$(stat -c '%a' deploy/compose/.env)"
          (( (8#${env_mode} & 0022) == 0 )) || {
            echo "deploy/compose/.envにgroup/otherの書込み権限があります: ${env_mode}" >&2
            exit 1
          }

      - name: 本番デプロイ要求を再検証
        shell: bash
        env:
          CHANGE_REQUEST_ID: ${{ inputs.change_request_id }}
          DEPLOYMENT_REASON: ${{ inputs.deployment_reason }}
          DEPLOYMENT_CONFIRMATION: ${{ inputs.confirmation }}
          REQUESTED_BY: ${{ github.actor }}
          REQUESTED_REF: ${{ github.ref }}
          REQUESTED_SHA: ${{ github.sha }}
          REQUEST_RUN_ID: ${{ github.run_id }}
          REQUEST_RUN_ATTEMPT: ${{ github.run_attempt }}
          PRODUCTION_DEPLOYMENT_REQUEST_DIR: artifacts/production-deployment/request
        run: bash scripts/validate-production-deployment-request.sh

      - name: GHCRへread-onlyログイン
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "${GHCR_TOKEN}" | docker login "${REGISTRY}" \
            --username "${GITHUB_ACTOR}" \
            --password-stdin

      - name: デプロイ前のCompose状態を保存
        shell: bash
        env:
          VAULTSEND_IMAGE: ${{ needs.prepare.outputs.image_ref }}
        run: |
          mkdir -p artifacts/production-deployment
          docker compose \
            --env-file deploy/compose/.env \
            -f deploy/compose/operations.yml \
            ps --format json \
            > artifacts/production-deployment/pre-deploy-compose-ps.json || true

      - name: 同一digestを再検証してComposeへデプロイ
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VAULTSEND_IMAGE: ${{ needs.prepare.outputs.image_ref }}
          EXPECTED_SOURCE_REVISION: ${{ needs.prepare.outputs.source_revision }}
          DEPLOY_VERIFICATION_DIR: artifacts/production-deployment/host-verification
        run: bash scripts/deploy-verified-compose.sh --deploy "${VAULTSEND_IMAGE}"

      - name: 起動サービスを確認
        shell: bash
        env:
          VAULTSEND_IMAGE: ${{ needs.prepare.outputs.image_ref }}
        run: |
          set -Eeuo pipefail
          compose_command=(
            docker compose
            --env-file deploy/compose/.env
            -f deploy/compose/operations.yml
          )
          expected_services=$'alertmanager\naudit-worker\ngrafana\nprometheus'
          running_services=''
          for _ in $(seq 1 12); do
            running_services="$(
              VAULTSEND_IMAGE="${VAULTSEND_IMAGE}" \
                "${compose_command[@]}" ps --status running --services | sort
            )"
            if [[ "${running_services}" == "${expected_services}" ]]; then
              break
            fi
            sleep 5
          done
          if [[ "${running_services}" != "${expected_services}" ]]; then
            echo '本番サービスがすべてrunningになりませんでした' >&2
            VAULTSEND_IMAGE="${VAULTSEND_IMAGE}" "${compose_command[@]}" ps >&2
            exit 1
          fi
          VAULTSEND_IMAGE="${VAULTSEND_IMAGE}" \
            "${compose_command[@]}" ps --format json \
            > artifacts/production-deployment/post-deploy-compose-ps.json

      - name: デプロイ結果manifestを生成
        if: success()
        shell: bash
        env:
          IMAGE_REF: ${{ needs.prepare.outputs.image_ref }}
          SOURCE_REVISION: ${{ needs.prepare.outputs.source_revision }}
          CHANGE_REQUEST_ID: ${{ inputs.change_request_id }}
          REASON_SHA256: ${{ needs.prepare.outputs.reason_sha256 }}
          RUNNER_NAME_VALUE: ${{ runner.name }}
        run: |
          deployed_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          jq -n \
            --arg image "${IMAGE_REF}" \
            --arg revision "${SOURCE_REVISION}" \
            --arg change_request_id "${CHANGE_REQUEST_ID}" \
            --arg reason_sha256 "${REASON_SHA256}" \
            --arg requested_by "${GITHUB_ACTOR}" \
            --arg runner_name "${RUNNER_NAME_VALUE}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --arg run_attempt "${GITHUB_RUN_ATTEMPT}" \
            --arg deployed_at "${deployed_at}" \
            '{
              status: "succeeded",
              environment: "production",
              image: $image,
              revision: $revision,
              change_request_id: $change_request_id,
              deployment_reason_sha256: $reason_sha256,
              requested_by: $requested_by,
              runner_name: $runner_name,
              run_id: $run_id,
              run_attempt: $run_attempt,
              deployed_at: $deployed_at
            }' > artifacts/production-deployment/deployment-result.json

      - name: 本番デプロイ結果をJob Summaryへ記録
        if: success()
        shell: bash
        run: |
          {
            echo '## 本番デプロイ成功'
            echo
            echo '| 項目 | 値 |'
            echo '|---|---|'
            echo "| 変更管理番号 | \`${{ inputs.change_request_id }}\` |"
            echo "| Image | \`${{ needs.prepare.outputs.image_ref }}\` |"
            echo "| Revision | \`${{ needs.prepare.outputs.source_revision }}\` |"
            echo "| Runner | \`${{ runner.name }}\` |"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: 本番デプロイ証跡を保存
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: production-deployment-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/production-deployment
          if-no-files-found: warn
          retention-days: 90
