name: Production Deployment Authorization

on:
  workflow_dispatch:
    inputs:
      change_request_id:
        description: 変更管理番号（Issue、申請、作業依頼など）
        required: true
        type: string
      deployment_reason:
        description: 本番デプロイ理由（10〜300文字、1行）
        required: true
        type: string
      confirmation:
        description: 誤操作防止のためDEPLOY_PRODUCTIONを入力
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-deployment-authorization
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  EXPECTED_IMAGE_REPOSITORY: ghcr.io/mizzz-ivr/vaultsend

jobs:
  prepare:
    name: 本番デプロイ要求・公開イメージ事前検証
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
      attestations: read
    outputs:
      image_ref: ${{ steps.release.outputs.image_ref }}
      source_revision: ${{ steps.release.outputs.source_revision }}
      reason_sha256: ${{ steps.request.outputs.reason_sha256 }}

    steps:
      - name: mainの検証コードを取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: 本番デプロイ要求を検証
        id: request
        shell: bash
        env:
          CHANGE_REQUEST_ID: ${{ inputs.change_request_id }}
          DEPLOYMENT_REASON: ${{ inputs.deployment_reason }}
          DEPLOYMENT_CONFIRMATION: ${{ inputs.confirmation }}
          REQUESTED_BY: ${{ github.actor }}
          REQUESTED_REF: ${{ github.ref }}
          REQUESTED_SHA: ${{ github.sha }}
          REQUEST_RUN_ID: ${{ github.run_id }}
          REQUEST_RUN_ATTEMPT: ${{ github.run_attempt }}
          PRODUCTION_DEPLOYMENT_REQUEST_DIR: artifacts/production-deployment/preflight/request
        run: |
          bash scripts/validate-production-deployment-request.sh
          reason_sha256="$(jq -r '.deployment_reason_sha256' artifacts/production-deployment/preflight/request/request.json)"
          echo "reason_sha256=${reason_sha256}" >> "${GITHUB_OUTPUT}"

      - name: GHCRへread-onlyログイン
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export DOCKER_CONFIG="${RUNNER_TEMP}/docker-preflight"
          mkdir -p "${DOCKER_CONFIG}"
          printf '%s' "${GHCR_TOKEN}" | docker login "${REGISTRY}" \
            --username "${GITHUB_ACTOR}" \
            --password-stdin
          echo "DOCKER_CONFIG=${DOCKER_CONFIG}" >> "${GITHUB_ENV}"

      - name: 現在の公開済みmainイメージを解決
        id: release
        shell: bash
        env:
          RELEASE_RESOLUTION_DIR: artifacts/production-deployment/preflight/release
        run: |
          bash scripts/resolve-current-release-image.sh
          image_ref="$(jq -r '.image' artifacts/production-deployment/preflight/release/release-resolution.json)"
          source_revision="$(jq -r '.revision' artifacts/production-deployment/preflight/release/release-resolution.json)"
          echo "image_ref=${image_ref}" >> "${GITHUB_OUTPUT}"
          echo "source_revision=${source_revision}" >> "${GITHUB_OUTPUT}"

      - name: Cosignをセットアップ
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: 署名・provenance・SPDX SBOMを事前検証
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VAULTSEND_IMAGE: ${{ steps.release.outputs.image_ref }}
          EXPECTED_SOURCE_REVISION: ${{ steps.release.outputs.source_revision }}
          DEPLOY_VERIFICATION_DIR: artifacts/production-deployment/preflight/release-verification
        run: bash scripts/verify-release-image.sh

      - name: 承認対象manifestを生成
        shell: bash
        run: |
          jq -n \
            --slurpfile request artifacts/production-deployment/preflight/request/request.json \
            --slurpfile release artifacts/production-deployment/preflight/release/release-resolution.json \
            --slurpfile verification artifacts/production-deployment/preflight/release-verification/verification-summary.json \
            '{
              request: $request[0],
              release: $release[0],
              preflight_verification: $verification[0],
              approval_environment: "production"
            }' > artifacts/production-deployment/preflight/approval-target.json
          jq -e \
            '.release.image == .preflight_verification.image and
             .release.revision == .preflight_verification.revision and
             .preflight_verification.cosign_signature_verified == true and
             .preflight_verification.provenance_verified == true and
             .preflight_verification.spdx_sbom_verified == true' \
            artifacts/production-deployment/preflight/approval-target.json >/dev/null

      - name: 事前検証結果をJob Summaryへ記録
        shell: bash
        env:
          SUMMARY_CHANGE_REQUEST_ID: ${{ inputs.change_request_id }}
          SUMMARY_IMAGE_REF: ${{ steps.release.outputs.image_ref }}
          SUMMARY_SOURCE_REVISION: ${{ steps.release.outputs.source_revision }}
          SUMMARY_REASON_SHA256: ${{ steps.request.outputs.reason_sha256 }}
        run: |
          {
            echo '## 本番デプロイ許可申請'
            echo
            echo '| 項目 | 値 |'
            echo '|---|---|'
            echo "| 変更管理番号 | \`${SUMMARY_CHANGE_REQUEST_ID}\` |"
            echo "| 起動者 | \`${GITHUB_ACTOR}\` |"
            echo "| Image | \`${SUMMARY_IMAGE_REF}\` |"
            echo "| Revision | \`${SUMMARY_SOURCE_REVISION}\` |"
            echo "| 理由SHA-256 | \`${SUMMARY_REASON_SHA256}\` |"
            echo
            echo "\`production\` Environmentの承認後、同じdigestを再検証して2時間有効なAttestation付き許可証を発行します。"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: 承認前の検証証跡を保存
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: production-deployment-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/production-deployment/preflight
          if-no-files-found: warn
          retention-days: 90

      - name: GHCR認証情報を削除
        if: always()
        shell: bash
        run: rm -rf "${DOCKER_CONFIG:-${RUNNER_TEMP}/docker-preflight}"

  authorize:
    name: production承認後のデプロイ許可証発行
    needs:
      - prepare
    environment:
      name: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: 承認済みmainの検証コードを取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: production Environmentと実行contextを検証
        shell: bash
        env:
          WORKFLOW_REF_VALUE: ${{ github.workflow_ref }}
          PRODUCTION_DEPLOYMENT_ENABLED_VALUE: ${{ vars.PRODUCTION_DEPLOYMENT_ENABLED }}
          PRODUCTION_ENVIRONMENT_GUARD_VALUE: ${{ secrets.PRODUCTION_ENVIRONMENT_GUARD }}
        run: |
          set -Eeuo pipefail
          [[ "${PRODUCTION_DEPLOYMENT_ENABLED_VALUE}" == "true" ]] || {
            echo 'production Environmentが有効化されていません' >&2
            exit 1
          }
          [[ ${#PRODUCTION_ENVIRONMENT_GUARD_VALUE} -ge 32 ]] || {
            echo 'production Environment guardが未設定または短すぎます' >&2
            exit 1
          }
          [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]] || {
            echo "許可されていないeventです: ${GITHUB_EVENT_NAME}" >&2
            exit 1
          }
          [[ "${GITHUB_REF}" == "refs/heads/main" ]] || {
            echo "本番デプロイ許可証はmainからのみ発行できます: ${GITHUB_REF}" >&2
            exit 1
          }
          [[ "${WORKFLOW_REF_VALUE}" == "${GITHUB_REPOSITORY}/.github/workflows/production-deploy.yml@refs/heads/main" ]] || {
            echo "Workflow refがmainの許可証発行Workflowではありません: ${WORKFLOW_REF_VALUE}" >&2
            exit 1
          }

      - name: 本番デプロイ要求を再検証
        shell: bash
        env:
          CHANGE_REQUEST_ID: ${{ inputs.change_request_id }}
          DEPLOYMENT_REASON: ${{ inputs.deployment_reason }}
          DEPLOYMENT_CONFIRMATION: ${{ inputs.confirmation }}
          REQUESTED_BY: ${{ github.actor }}
          REQUESTED_REF: ${{ github.ref }}
          REQUESTED_SHA: ${{ github.sha }}
          REQUEST_RUN_ID: ${{ github.run_id }}
          REQUEST_RUN_ATTEMPT: ${{ github.run_attempt }}
          PRODUCTION_DEPLOYMENT_REQUEST_DIR: artifacts/production-deployment/authorization/request
        run: bash scripts/validate-production-deployment-request.sh

      - name: GHCRへread-onlyログイン
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export DOCKER_CONFIG="${RUNNER_TEMP}/docker-authorization"
          mkdir -p "${DOCKER_CONFIG}"
          printf '%s' "${GHCR_TOKEN}" | docker login "${REGISTRY}" \
            --username "${GITHUB_ACTOR}" \
            --password-stdin
          echo "DOCKER_CONFIG=${DOCKER_CONFIG}" >> "${GITHUB_ENV}"

      - name: 承認待ちの間に公開対象が変わっていないことを確認
        id: release
        shell: bash
        env:
          EXPECTED_SOURCE_REVISION: ${{ needs.prepare.outputs.source_revision }}
          EXPECTED_IMAGE_REF: ${{ needs.prepare.outputs.image_ref }}
          RELEASE_RESOLUTION_DIR: artifacts/production-deployment/authorization/release
        run: |
          bash scripts/resolve-current-release-image.sh
          current_image="$(jq -r '.image' artifacts/production-deployment/authorization/release/release-resolution.json)"
          if [[ "${current_image}" != "${EXPECTED_IMAGE_REF}" ]]; then
            echo "承認待ちの間に公開イメージが変更されました: ${current_image}" >&2
            exit 1
          fi
          echo "image_ref=${current_image}" >> "${GITHUB_OUTPUT}"

      - name: Cosignをセットアップ
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: 承認済みdigestの署名・provenance・SPDX SBOMを再検証
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VAULTSEND_IMAGE: ${{ needs.prepare.outputs.image_ref }}
          EXPECTED_SOURCE_REVISION: ${{ needs.prepare.outputs.source_revision }}
          DEPLOY_VERIFICATION_DIR: artifacts/production-deployment/authorization/release-verification
        run: bash scripts/verify-release-image.sh

      - name: 期限付きデプロイ許可manifestを生成
        id: manifest
        shell: bash
        env:
          IMAGE_REF: ${{ needs.prepare.outputs.image_ref }}
          SOURCE_REVISION: ${{ needs.prepare.outputs.source_revision }}
          REASON_SHA256: ${{ needs.prepare.outputs.reason_sha256 }}
          CHANGE_REQUEST_ID_VALUE: ${{ inputs.change_request_id }}
        run: |
          set -Eeuo pipefail
          authorization_dir='artifacts/production-deployment/authorization'
          manifest_path="${authorization_dir}/authorization-manifest.json"
          authorized_at_epoch="$(date -u +%s)"
          expires_at_epoch="$((authorized_at_epoch + 7200))"
          authorized_at="$(date -u -d "@${authorized_at_epoch}" +'%Y-%m-%dT%H:%M:%SZ')"
          expires_at="$(date -u -d "@${expires_at_epoch}" +'%Y-%m-%dT%H:%M:%SZ')"

          jq -n \
            --arg schema_version '1' \
            --arg authorization_status 'approved' \
            --arg environment 'production' \
            --arg image "${IMAGE_REF}" \
            --arg source_revision "${SOURCE_REVISION}" \
            --arg change_request_id "${CHANGE_REQUEST_ID_VALUE}" \
            --arg deployment_reason_sha256 "${REASON_SHA256}" \
            --arg requested_by "${GITHUB_ACTOR}" \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg workflow_ref "${GITHUB_WORKFLOW_REF}" \
            --arg workflow_sha "${GITHUB_SHA}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --arg run_attempt "${GITHUB_RUN_ATTEMPT}" \
            --arg authorized_at "${authorized_at}" \
            --arg expires_at "${expires_at}" \
            --argjson authorized_at_epoch "${authorized_at_epoch}" \
            --argjson expires_at_epoch "${expires_at_epoch}" \
            '{
              schema_version: $schema_version,
              authorization_status: $authorization_status,
              environment: $environment,
              image: $image,
              source_revision: $source_revision,
              change_request_id: $change_request_id,
              deployment_reason_sha256: $deployment_reason_sha256,
              requested_by: $requested_by,
              workflow: {
                repository: $repository,
                ref: $workflow_ref,
                sha: $workflow_sha,
                run_id: $run_id,
                run_attempt: $run_attempt
              },
              authorized_at: $authorized_at,
              authorized_at_epoch: $authorized_at_epoch,
              expires_at: $expires_at,
              expires_at_epoch: $expires_at_epoch
            }' > "${manifest_path}"

          jq -e \
            '.authorization_status == "approved" and
             .environment == "production" and
             .workflow.ref == "mizzz-ivr/vaultsend/.github/workflows/production-deploy.yml@refs/heads/main" and
             (.expires_at_epoch - .authorized_at_epoch) == 7200' \
            "${manifest_path}" >/dev/null

          sha256sum "${manifest_path}" > "${manifest_path}.sha256"
          echo "manifest_path=${manifest_path}" >> "${GITHUB_OUTPUT}"

      - name: デプロイ許可manifestへArtifact Attestationを付与
        id: attest
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: ${{ steps.manifest.outputs.manifest_path }}
          show-summary: true

      - name: 許可manifestのAttestationを即時検証
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MANIFEST_PATH: ${{ steps.manifest.outputs.manifest_path }}
        run: |
          set -Eeuo pipefail
          verification_file='artifacts/production-deployment/authorization/authorization-attestation-verification.json'
          for attempt in $(seq 1 6); do
            if gh attestation verify "${MANIFEST_PATH}" \
              --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/production-deploy.yml" \
              --source-ref 'refs/heads/main' \
              --source-digest "${GITHUB_SHA}" \
              --cert-oidc-issuer 'https://token.actions.githubusercontent.com' \
              --deny-self-hosted-runners \
              --format json \
              > "${verification_file}"; then
              break
            fi
            if [[ "${attempt}" -eq 6 ]]; then
              echo 'デプロイ許可manifestのAttestationを検証できませんでした' >&2
              exit 1
            fi
            sleep 5
          done
          jq -e 'type == "array" and length > 0' "${verification_file}" >/dev/null

      - name: 許可証情報をJob Summaryへ記録
        shell: bash
        env:
          MANIFEST_PATH: ${{ steps.manifest.outputs.manifest_path }}
        run: |
          {
            echo '## 本番デプロイ許可証を発行しました'
            echo
            echo '| 項目 | 値 |'
            echo '|---|---|'
            jq -r '
              "| 変更管理番号 | `\(.change_request_id)` |\n" +
              "| Image | `\(.image)` |\n" +
              "| Revision | `\(.source_revision)` |\n" +
              "| 有効期限 | `\(.expires_at)` |\n" +
              "| Workflow run | `\(.workflow.run_id)` |"
            ' "${MANIFEST_PATH}"
            echo
            echo '本番hostでは許可manifestのAttestation・有効期限・Workflow run・イメージ署名を再検証し、一度だけ使用してください。'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Attestation付き本番デプロイ許可証を保存
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: production-deployment-authorization-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/production-deployment/authorization
          if-no-files-found: warn
          retention-days: 90

      - name: GHCR認証情報を削除
        if: always()
        shell: bash
        run: rm -rf "${DOCKER_CONFIG:-${RUNNER_TEMP}/docker-authorization}"
